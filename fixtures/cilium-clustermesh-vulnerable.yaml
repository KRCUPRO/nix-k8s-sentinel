apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-config
  namespace: kube-system
data:
  cluster-name: "unhardened-cluster"
  cluster-id: "0"
  encryption.type: "none"
  tunnel-protocol: "vxlan"
  etcd-tls: "false"
  ca-cert: "none"
---
apiVersion: v1
kind: Service
metadata:
  name: internal-vault-db
  namespace: prod-sec
  annotations:
    io.cilium/global-service: "true"
    io.cilium/shared-service: "false"
data:
  backend-count: "2048"
spec:
  ports:
  - name: db
    port: 5432
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unrestricted-wildcard-policy
  namespace: prod-sec
spec:
  endpointSelector:
    matchLabels:
      app: vault
  ingress:
  - fromEndpoints:
    - matchLabels:
        cluster: "*"
