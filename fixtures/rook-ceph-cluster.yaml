apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph-vulnerable
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.1
  dataDirHostPath: /var/lib/rook
  mon:
    count: 2
    allowMultiplePerNode: true
  network:
    hostNetwork: true
  dashboard:
    enabled: true
    ssl: false
    port: 7000
  storage:
    useAllNodes: true
    useAllDevices: true
    deviceFilter: "^sd[a-z]"
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool-underreplicated
  namespace: rook-ceph
spec:
  failureDomain: osd
  replicated:
    size: 2
    requireSafeReplicaSize: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block-db
provisioner: rook-ceph.rbd.csi.ceph.com
reclaimPolicy: Delete
parameters:
  pool: replicapool-underreplicated
  clusterID: rook-ceph
  imageFormat: "2"
  imageFeatures: layering
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-db-pvc
  namespace: prod-database
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rook-ceph-block-db
  resources:
    requests:
      storage: 100Gi
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph-hardened
  namespace: rook-ceph-secure
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.4
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  network:
    connections:
      encryption: true
  dashboard:
    enabled: true
    ssl: true
  storage:
    useAllNodes: false
    storageDeviceSets:
      - name: encrypted-nvme-osds
        count: 3
        encrypted: true
