apiVersion: v1
kind: Pod
metadata:
  name: legacy-crawler-worker
  namespace: untrusted-apps
  labels:
    app: crawler
spec:
  hostPID: true
  hostIPC: true
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: crawler
      image: registry.internal.corp/crawler:v1.2.0
      securityContext:
        capabilities:
          add:
            - NET_RAW
            - SYS_ADMIN
---
apiVersion: v1
kind: Pod
metadata:
  name: hardened-payment-service
  namespace: payments
  labels:
    app: payment-gateway
spec:
  hostPID: false
  hostIPC: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: registry.internal.corp/payment-api:v2.4.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
