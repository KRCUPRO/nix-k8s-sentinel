apiVersion: spire.spiffe.io/v1alpha1
kind: SpireRegistrationEntry
metadata:
  name: payment-service-attested
  namespace: finance
spec:
  spiffe_id: "spiffe://cluster.local/ns/finance/sa/payment-service"
  selectors:
    - k8s:ns:finance
    - k8s:sa:payment-service
    - k8s:container-image:sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069
---
apiVersion: spire.spiffe.io/v1alpha1
kind: SpireRegistrationEntry
metadata:
  name: unhardened-wildcard-service
  namespace: default
spec:
  spiffe_id: "spiffe://cluster.local/ns/default/sa/wildcard-app"
  selectors:
    - k8s:ns:*
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payment-spiffe-mtls
  namespace: finance
spec:
  description: "Enforces cryptographically attested SPIFFE identity with required mTLS"
  endpointSelector:
    matchLabels:
      app: payment-service
  ingress:
    - fromEndpoints:
        - matchLabels:
            "io.spiffe.id": "spiffe://cluster.local/ns/finance/sa/checkout-service"
      authentication:
        mode: required
  egress:
    - toEndpoints:
        - matchLabels:
            "io.spiffe.id": "spiffe://cluster.local/ns/finance/sa/database"
      authentication:
        mode: required
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unauthenticated-ingress-policy
  namespace: frontend
spec:
  description: "Permits unauthenticated lateral traffic without SPIFFE verification"
  endpointSelector:
    matchLabels:
      app: web-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: external-partner
