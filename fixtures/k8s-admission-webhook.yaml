---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: sentinel-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: sentinel-system/sentinel-ca
    sentinel.defense.io/hardened-by: nix-k8s-sentinel
webhooks:
  - name: validation.sentinel.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: 
      service:
        name: sentinel-webhook-svc
        namespace: sentinel-system
        path: /validate
        port: 443
    failurePolicy: Fail
    timeoutSeconds: 3
    sideEffects: None
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-node-lease", "kube-public"]
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["*"]
        apiVersions: ["v1"]
        resources: ["pods", "deployments", "daemonsets"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: sentinel-mutating-webhook
  annotations:
    cert-manager.io/inject-ca-from: sentinel-system/sentinel-ca
webhooks:
  - name: mutation.sentinel.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      caBundle: 
      service:
        name: sentinel-mutator-svc
        namespace: sentinel-system
        path: /mutate
        port: 443
    failurePolicy: Fail
    timeoutSeconds: 3
    reinvocationPolicy: IfNeeded
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system"]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
