apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-spiffe-microsegmentation
  namespace: finance
  labels:
    app.kubernetes.io/managed-by: nix-k8s-sentinel
    security.sentinel/default-deny: "true"
    security.sentinel/zero-trust: "true"
spec:
  description: "Enforces default-deny microsegmentation posture for non-attested traffic"
  endpointSelector: {}
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: payment-service-spiffe-attested
  namespace: finance
  labels:
    app.kubernetes.io/managed-by: nix-k8s-sentinel
    security.sentinel/zero-trust: "true"
    security.sentinel/spiffe-attested: "true"
spec:
  description: "Enforces cryptographically attested SPIFFE identity for payment-service"
  endpointSelector:
    matchLabels:
      app: payment-service
  ingress:
    - fromEndpoints:
        - matchLabels:
            "io.spiffe.id": "spiffe://cluster.local/ns/finance/sa/payment-service"
      authentication:
        mode: required
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
---
